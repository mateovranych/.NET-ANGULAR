<button mat-raised-button color="primary" (click)="agregarAlumno()">
  Nuevo alumno
</button>

<table mat-table [dataSource]="alumnos" class="mat-elevation-z8">

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let alumno"> {{ alumno.id }} </td>
  </ng-container>

  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef> Nombre </th>
    <td mat-cell *matCellDef="let alumno"> {{ alumno.nombre }} </td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef> Email </th>
    <td mat-cell *matCellDef="let alumno"> {{ alumno.email }} </td>
  </ng-container>

    <ng-container matColumnDef="materia">
    <th mat-header-cell *matHeaderCellDef> materia</th>
    <td mat-cell *matCellDef="let alumno"> {{ alumno.materia }} </td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef> Acciones </th>
    <td mat-cell *matCellDef="let alumno">      
      <button mat-button color="primary" (click)="editarAlumno(alumno)">Editar</button>
      <button mat-button color="warn"    (click)="eliminar(alumno)">Eliminar</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
