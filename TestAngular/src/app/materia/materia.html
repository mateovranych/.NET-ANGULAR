<button mat-raised-button color="primary" (click)="agregarMateria()">
  Nueva Materia
</button>

<table mat-table [dataSource]="materia" class="mat-elevation-z8">

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> id </th>

    <td mat-cell *matCellDef="let materia"> {{ materia.id }} </td>

  </ng-container>

  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef> nombre </th>
    <td mat-cell *matCellDef="let materia"> {{ materia.nombre }} </td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef> acciones </th>
    <td mat-cell *matCellDef="let materia">      
      <button mat-button color="primary" (click)="editarMateria(materia)">Editar</button>
      <button mat-button color="warn"    (click)="eliminar(materia)">Eliminar</button>
    </td>
  </ng-container>


  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
